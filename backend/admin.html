<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusCare - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1250px;
            margin: auto;
        }

        h1 {
            color: #123c8c;
            margin-bottom: 25px;
        }

        /* Statistics */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin: 0 0 10px;
            color: #555;
        }

        .card p {
            font-size: 30px;
            font-weight: bold;
            margin: 0;
        }

        .total {
            color: #123c8c;
        }

        .pending-count {
            color: orange;
        }

        .resolved-count {
            color: green;
        }

        /* Controls */

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .controls input,
        .controls select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .controls input {
            flex: 1;
        }

        .refresh-btn {
            background: #123c8c;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .refresh-btn:hover {
            background: #0d2d6b;
        }

        /* Table */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #123c8c;
            color: white;
        }

        tr:hover {
            background: #f8faff;
        }

        /* Status */

        .pending {
            color: orange;
            font-weight: bold;
        }

        .resolved {
            color: green;
            font-weight: bold;
        }

        /* Buttons */

        .resolve-btn {
            background: #198754;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .resolve-btn:hover {
            background: #146c43;
        }

        .completed {
            color: green;
            font-weight: bold;
        }

        /* No data */

        .no-data {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        /* Mobile */

        @media (max-width: 768px) {

            body {
                padding: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📋 CampusCare - Admin Dashboard</h1>

    <!-- Statistics -->

    <div class="stats">

        <div class="card">
            <h3>📋 Total Complaints</h3>
            <p class="total" id="totalCount">0</p>
        </div>

        <div class="card">
            <h3>⏳ Pending</h3>
            <p class="pending-count" id="pendingCount">0</p>
        </div>

        <div class="card">
            <h3>✅ Resolved</h3>
            <p class="resolved-count" id="resolvedCount">0</p>
        </div>

    </div>


    <!-- Search and Filter -->

    <div class="controls">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search student, complaint or description..."
        >

        <select id="statusFilter">

            <option value="All">All Status</option>
            <option value="Pending">Pending</option>
            <option value="Resolved">Resolved</option>

        </select>

        <button class="refresh-btn" onclick="loadComplaints()">
            🔄 Refresh
        </button>

    </div>


    <!-- Complaints Table -->

    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Student</th>
                    <th>Email</th>
                    <th>Type</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="complaintTable">

            </tbody>

        </table>

    </div>

</div>


<script>

let complaints = [];


// Load complaints

function loadComplaints() {

    fetch("http://localhost:5000/complaints")

        .then(response => {

            if (!response.ok) {
                throw new Error("Failed to load complaints");
            }

            return response.json();

        })

        .then(data => {

            complaints = data;

            updateStatistics();

            displayComplaints();

        })

        .catch(error => {

            console.error("Error:", error);

            alert("❌ Cannot connect to CampusCare server");

        });
}


// Update statistics

function updateStatistics() {

    const total = complaints.length;

    const pending =
        complaints.filter(c => c.status === "Pending").length;

    const resolved =
        complaints.filter(c => c.status === "Resolved").length;


    document.getElementById("totalCount").textContent = total;

    document.getElementById("pendingCount").textContent = pending;

    document.getElementById("resolvedCount").textContent = resolved;
}


// Display complaints

function displayComplaints() {

    const table =
        document.getElementById("complaintTable");

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const filter =
        document.getElementById("statusFilter").value;


    table.innerHTML = "";


    const filteredComplaints = complaints.filter(complaint => {

        const matchesSearch =

            complaint.student_name
                .toLowerCase()
                .includes(search)

            ||

            complaint.complaint_type
                .toLowerCase()
                .includes(search)

            ||

            complaint.description
                .toLowerCase()
                .includes(search);


        const matchesStatus =

            filter === "All" ||
            complaint.status === filter;


        return matchesSearch && matchesStatus;

    });


    if (filteredComplaints.length === 0) {

        table.innerHTML = `

            <tr>
                <td colspan="8" class="no-data">
                    No complaints found
                </td>
            </tr>

        `;

        return;
    }


    filteredComplaints.forEach(complaint => {

        const row = document.createElement("tr");


        const statusHTML =

            complaint.status === "Resolved"

            ?

            `<span class="resolved">✅ Resolved</span>`

            :

            `<span class="pending">⏳ Pending</span>`;


        const actionHTML =

            complaint.status === "Resolved"

            ?

            `<span class="completed">Completed</span>`

            :

            `<button
                class="resolve-btn"
                onclick="resolveComplaint(${complaint.id})">
                Resolve
            </button>`;


        row.innerHTML = `

            <td>${complaint.id}</td>

            <td>${complaint.student_name}</td>

            <td>${complaint.email || "-"}</td>

            <td>${complaint.complaint_type}</td>

            <td>${complaint.description}</td>

            <td>${statusHTML}</td>

            <td>${formatDate(complaint.created_at)}</td>

            <td>${actionHTML}</td>

        `;


        table.appendChild(row);

    });

}


// Resolve complaint

function resolveComplaint(id) {

    const confirmResolve =
        confirm("Are you sure you want to resolve this complaint?");


    if (!confirmResolve) {
        return;
    }


    fetch(`http://localhost:5000/complaints/${id}`, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        }

    })

    .then(response => {

        if (!response.ok) {
            throw new Error("Failed to resolve complaint");
        }

        return response.json();

    })

    .then(data => {

        alert("✅ Complaint resolved successfully!");

        loadComplaints();

    })

    .catch(error => {

        console.error("Error:", error);

        alert("❌ Failed to resolve complaint");

    });

}


// Format date

function formatDate(dateString) {

    const date = new Date(dateString);

    return date.toLocaleString();

}


// Search

document
    .getElementById("searchInput")
    .addEventListener("input", displayComplaints);


// Filter

document
    .getElementById("statusFilter")
    .addEventListener("change", displayComplaints);


// Initial load

loadComplaints();

</script>

</body>
</html>
